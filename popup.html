<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loose Lips Sink Ships</title>
  <style>
    :root {
      color-scheme: light;
      --navy-950: #0b1f33;
      --navy-800: #173b5d;
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --ink: #172033;
      --muted: #64748b;
      --line: #dce4ec;
      --surface: #ffffff;
      --canvas: #f3f7fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 490px;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 100% 0, rgba(13, 148, 136, 0.11), transparent 35%),
        var(--canvas);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .shell { padding: 20px; }

    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 1px 2px 17px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      padding: 4px;
      border-radius: 11px;
      background: var(--surface);
      box-shadow: 0 5px 14px rgba(11, 31, 51, 0.13);
    }

    .header h1 {
      color: var(--navy-950);
      font-size: 15px;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .header p { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .header-version { padding: 1px 5px; border: 1px solid #d5dee8; border-radius: 999px; background: rgba(255, 255, 255, 0.78); color: #526176; font-size: 9px; font-weight: 650; }

    .card {
      margin-bottom: 11px;
      padding: 15px 16px;
      border: 1px solid rgba(203, 213, 225, 0.85);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 18px rgba(15, 42, 68, 0.055);
    }

    .card-title {
      margin-bottom: 11px;
      color: #748297;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.075em;
      text-transform: uppercase;
    }

    .status-row { display: flex; align-items: center; gap: 10px; }

    .status-dot {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px currentColor;
    }
    .status-dot.ready       { color: #16a34a; background: #16a34a; }
    .status-dot.downloading { color: #d97706; background: #d97706; animation: pulse 1.2s infinite; }
    .status-dot.unavailable { color: #dc2626; background: #dc2626; }
    .status-dot.checking    { color: #94a3b8; background: #94a3b8; animation: pulse 1.2s infinite; }
    .status-dot.fallback    { color: #2563eb; background: #2563eb; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    .status-label { color: var(--navy-950); font-size: 13px; font-weight: 650; }
    .status-detail { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.45; }

    .providers-list {
      margin-top: 11px;
      padding-top: 8px;
      border-top: 1px solid #eef2f6;
      font-size: 11px;
    }

    .provider-row { display: flex; align-items: center; gap: 7px; min-height: 25px; }
    .provider-dot { width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; }
    .provider-dot.on { background: #16a34a; }
    .provider-dot.off { background: #cbd5e1; }
    .provider-name { color: #334155; }
    .provider-tier { margin-left: auto; color: #8492a6; font-size: 9px; font-weight: 650; text-transform: uppercase; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-item { position: relative; text-align: center; }
    .stat-item + .stat-item::before { position: absolute; top: 4px; bottom: 4px; left: 0; width: 1px; background: #e7edf3; content: ""; }
    .stat-value { color: var(--navy-800); font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 720; line-height: 1.15; }
    .stat-label { margin-top: 4px; color: #5f6f84; font-size: 9px; font-weight: 650; letter-spacing: 0.055em; text-transform: uppercase; }

    .mode-badge {
      display: inline-flex;
      margin-top: 9px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 650;
    }
    .mode-badge.ai    { color: #1d4ed8; background: #dbeafe; }
    .mode-badge.regex { color: #92400e; background: #fef3c7; }
    .mode-badge.auto  { color: #08635c; background: #ccfbf1; }

    #guard-stats { min-height: 15px; margin-top: 8px; color: var(--muted); font-size: 10px; text-align: center; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 13px; }

    .btn {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid #ccd6e1;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--navy-800);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      text-align: center;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s, background 0.15s;
    }
    .btn:hover { border-color: #9fb0c3; background: #fff; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.28); outline-offset: 2px; }
    .btn.primary {
      grid-column: 1 / -1;
      border-color: var(--navy-950);
      background: linear-gradient(135deg, var(--navy-950), var(--navy-800));
      color: #fff;
      box-shadow: 0 5px 12px rgba(11, 31, 51, 0.17);
    }
    .btn.primary:hover { background: linear-gradient(135deg, #102e4c, #20517e); }

    .info { display: flex; align-items: flex-start; justify-content: center; gap: 6px; margin: 13px 7px 1px; color: #5f6f84; font-size: 10px; line-height: 1.45; text-align: center; }
    .info svg { width: 12px; height: 12px; flex: 0 0 auto; margin-top: 1px; color: var(--teal-700); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <img class="brand-mark" src="icons/icon48.png" width="40" height="40" alt="">
      <div>
        <h1>Loose Lips Sink Ships</h1>
        <p>PII protection, local first <span class="header-version" id="popup-version">v—</span></p>
      </div>
    </header>

    <section class="card" aria-labelledby="status-label">
      <div class="status-row" role="status" aria-live="polite" aria-atomic="true">
        <span id="status-dot" class="status-dot checking" aria-hidden="true"></span>
        <span id="status-label" class="status-label">Checking protection…</span>
      </div>
      <div id="status-detail" class="status-detail"></div>
      <div id="mode-badge-container"></div>
      <div id="providers-list" class="providers-list" role="list" aria-label="Configured processing providers"></div>
    </section>

    <section class="card" aria-labelledby="activity-title">
      <div id="activity-title" class="card-title">Protected activity</div>
      <div class="stats-grid">
        <div class="stat-item">
          <output id="stat-redactions" class="stat-value">—</output>
          <div class="stat-label">Redactions</div>
        </div>
        <div class="stat-item">
          <output id="stat-matches" class="stat-value">—</output>
          <div class="stat-label">PII found</div>
        </div>
        <div class="stat-item">
          <output id="stat-docs" class="stat-value">—</output>
          <div class="stat-label">Documents</div>
        </div>
      </div>
      <div id="guard-stats" aria-live="polite"></div>
    </section>

    <div class="btn-row">
      <button id="btn-redact" class="btn primary" type="button">Redact documents</button>
      <button id="btn-options" class="btn" type="button">Settings</button>
      <button id="btn-reset-stats" class="btn" type="button">Clear activity</button>
    </div>

    <p class="info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>Local processing stays on this device. Configured enterprise providers use your organisation’s infrastructure.</span>
    </p>
  </main>

  <script src="lib/browser-ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>
