<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLSS Offscreen Document</title>
</head>
<body>
  <!--
    Offscreen Document for Loose Lips Sink Ships.

    MV3 service workers cannot access Canvas or DOM APIs.
    This document provides:
      1. PDF page rendering (pdf.js → Canvas)
      2. OCR text extraction (Tesseract.js → WASM)
      3. Pixel-level redaction (Canvas black rectangles)
      4. PDF reconstruction (flattened images → new PDF)

    Communication: chrome.runtime.onMessage ↔ background.js
    Lifecycle: created on-demand, destroyed after idle timeout.
  -->

  <!--
    Load order matters:
    1. Vendor libs first (set globals: pdfjsLib, Tesseract)
    2. Then LLSS modules that depend on those globals
    3. Then the message handler last

    pdf.min.js is NOT loaded as type="module" — module scripts are
    deferred and would execute AFTER the non-module scripts, leaving
    pdfjsLib undefined when pdf-renderer.js runs.
  -->

  <!-- Vendor libraries (must be regular scripts, not modules) -->
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/tesseract/tesseract.min.js"></script>

  <!-- Vendor load check — logs immediately so failures are visible -->
  <script>
    console.log('[LLSS:offscreen] Vendor load check:',
      'pdfjsLib=' + (typeof pdfjsLib !== 'undefined' ? 'OK' : 'MISSING'),
      'Tesseract=' + (typeof Tesseract !== 'undefined' ? 'OK' : 'MISSING'));
  </script>

  <!-- Debug logger -->
  <script src="lib/debug.js"></script>

  <!-- LLSS document processing modules -->
  <script src="lib/documents/pdf-renderer.js"></script>
  <script src="lib/documents/ocr-processor.js"></script>
  <script src="lib/documents/pixel-redactor.js"></script>

  <!-- Nano (LanguageModel) session manager for service-worker proxy -->
  <script src="lib/nano-session.js"></script>

  <!-- Offscreen message handler (must be last) -->
  <script src="offscreen.js"></script>
</body>
</html>
