<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLSS Offscreen Document</title>
</head>
<body>
  <!--
    Offscreen Document for Loose Lips Sink Ships.

    LOAD ORDER:
      Phase 1 (regular scripts): Tesseract, debug, LLSS modules, offscreen.js
      Phase 2 (ES module):       pdf-bridge.js imports BOTH pdf.worker and
                                  pdf.min.mjs, then fires pdfjsReady.

    pdf.js is loaded ENTIRELY through the module bridge because:
      - pdf.min.mjs uses import.meta (requires module context)
      - Loading pdf.worker as a regular script silently fails in Chrome
        extension offscreen documents
      - The bridge guarantees both load in order: worker first, then lib

    Non-PDF operations (image OCR, Nano) work immediately from Phase 1.
    PDF operations wait for Phase 2 via waitForPdfjs().
  -->

  <!-- Phase 1: Regular scripts (no pdf.js here — it's all in Phase 2) -->
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="lib/debug.js"></script>
  <script src="lib/binary-transfer.js"></script>
  <script src="lib/browser-ai.js"></script>
  <script src="lib/documents/pdf-renderer.js"></script>
  <script src="lib/documents/ocr-processor.js"></script>
  <script src="lib/documents/pixel-redactor.js"></script>
  <script src="lib/redaction-spans.js"></script>
  <script src="lib/ai-entity-parser.js"></script>
  <script src="lib/nano-session.js"></script>
  <script src="lib/voice-transcriber.js"></script>
  <script src="offscreen.js"></script>

  <!-- Phase 2: ES module bridge loads pdf.worker + pdf.min.mjs -->
  <script type="module" src="vendor/pdf-bridge.js"></script>
</body>
</html>
