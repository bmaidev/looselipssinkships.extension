<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLSS Offscreen Document</title>
</head>
<body>
  <!--
    Offscreen Document for Loose Lips Sink Ships.

    LOAD ORDER (critical):

    Phase 1 (regular scripts, execute immediately in order):
      - pdf.worker.min.mjs as regular script → sets globalThis.pdfjsWorker
        (file has NO import.meta or ES module syntax despite .mjs extension)
      - Tesseract, debug, LLSS modules, offscreen.js

    Phase 2 (ES module, deferred):
      - pdf-bridge.js imports pdf.min.mjs (which DOES use import.meta)
        → sets globalThis.pdfjsLib, fires pdfjsReady event.
        pdf.js detects pdfjsWorker.WorkerMessageHandler and uses inline
        mode (no web worker spawn).

    Non-PDF operations (image OCR, Nano) work immediately from Phase 1.
    PDF operations wait for Phase 2 via waitForPdfjs().
  -->

  <!-- Phase 1: Regular scripts -->
  <!-- .js not .mjs — Chrome may silently skip .mjs files loaded without type="module" -->
  <script src="vendor/pdf.worker.min.js"></script>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="lib/debug.js"></script>
  <script src="lib/documents/pdf-renderer.js"></script>
  <script src="lib/documents/ocr-processor.js"></script>
  <script src="lib/documents/pixel-redactor.js"></script>
  <script src="lib/nano-session.js"></script>
  <script src="offscreen.js"></script>

  <!-- Phase 2: ES module for pdf.js main library (uses import.meta) -->
  <script type="module" src="vendor/pdf-bridge.js"></script>
</body>
</html>
