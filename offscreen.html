<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLSS Offscreen Document</title>
</head>
<body>
  <!--
    Offscreen Document for Loose Lips Sink Ships.

    MV3 service workers cannot access Canvas or DOM APIs.
    This document provides:
      1. PDF page rendering (pdf.js → Canvas)
      2. OCR text extraction (Tesseract.js → WASM)
      3. Pixel-level redaction (Canvas black rectangles)
      4. PDF reconstruction (flattened images → new PDF)
      5. Nano (LanguageModel) session proxy for service worker

    Communication: chrome.runtime.onMessage ↔ background.js
    Lifecycle: created on-demand, destroyed after idle timeout.

    LOAD ORDER:
      pdf.js uses import.meta (ES module only). It MUST be loaded via
      type="module". Module scripts are deferred — they execute AFTER
      all regular scripts. So the load order is:

      Phase 1 (synchronous): Tesseract, debug, LLSS modules, offscreen.js
      Phase 2 (deferred):    pdf-bridge.js imports pdf.min.mjs → sets pdfjsLib

      The message handler in offscreen.js is registered in Phase 1 and
      works immediately for non-PDF operations (image OCR, Nano).
      PDF operations check for pdfjsLib at call time.
  -->

  <!-- Phase 1: Regular scripts (execute immediately, in order) -->
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="lib/debug.js"></script>
  <script src="lib/documents/pdf-renderer.js"></script>
  <script src="lib/documents/ocr-processor.js"></script>
  <script src="lib/documents/pixel-redactor.js"></script>
  <script src="lib/nano-session.js"></script>
  <script src="offscreen.js"></script>

  <!-- Phase 2: ES module — loads pdf.js and fires pdfjsReady event -->
  <script type="module" src="vendor/pdf-bridge.js"></script>
</body>
</html>
